{
  "_comment": "VyOmni HQ 本地线路中断告警配置。部署到 /opt/vyomni-agent/line_alert.conf",
  "enabled": true,
  "check_interval": 15,
  "default_fail_threshold": 3,
  "_log_checks_comment": "每轮物理出口检测是否打印详细日志(link/ping命令/绑定方式/耗时/结果)到journal, 默认true",
  "log_checks": true,
  "_webhooks_comment": "本地直发告警通道。type: dingtalk/wecom/feishu/lark/telegram/generic。每个渠道可用 enabled 单独开关(缺省true)。可配多个全部发送",
  "webhooks": [
    {
      "type": "dingtalk",
      "enabled": true,
      "url": "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN"
    },
    {
      "_note": "飞书/Lark 自定义机器人",
      "type": "feishu",
      "enabled": false,
      "url": "https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_HOOK_ID"
    },
    {
      "_note": "Telegram: url 为 sendMessage 端点, 需填 chat_id",
      "type": "telegram",
      "enabled": false,
      "url": "https://api.telegram.org/botYOUR_BOT_TOKEN/sendMessage",
      "chat_id": "YOUR_CHAT_ID"
    }
  ],
  "_server_report_comment": "可选：回传告警事件到 Server 供看板展示。enabled=false 则纯本地直发",
  "server_report": {
    "enabled": false,
    "url": "http://SERVER_IP:9100/api/line-alert"
  },
  "_exports_comment": "物理出口监控。bind_mode 说明见下。VyOS多出口/策略路由环境务必用 auto 或 src_ip（-I接口名会假故障）",
  "_bind_mode_comment": "auto=自动取接口IPv4绑源(推荐,免手填) | src_ip=手填bind_src_ip绑源 | interface=绑接口名(VyOS PBR环境会误报,不推荐) | none=不绑走默认路由",
  "exports": [
    {
      "name": "电信CN2主线",
      "interface": "eth1",
      "enabled": true,
      "ping_target": "223.5.5.5",
      "bind_mode": "auto",
      "bind_src_ip": "",
      "fail_threshold": 3
    },
    {
      "name": "联通备线",
      "interface": "eth2",
      "enabled": true,
      "ping_target": "8.8.8.8",
      "bind_mode": "auto",
      "bind_src_ip": "",
      "fail_threshold": 3
    }
  ],
  "_tunnels_comment": "wg 隧道监控。enabled=false 则完全不执行隧道告警(仅监控物理出口)。watch_list 空=监控全部peer；aliases 为 peer公钥到可读名映射",
  "tunnels": {
    "enabled": true,
    "handshake_timeout": 180,
    "fail_threshold": 2,
    "watch_list": [],
    "aliases": {
      "PEER_PUBKEY_BASE64=": "上海分支"
    }
  }
}
