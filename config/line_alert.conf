{
  "_comment": "VyOmni HQ 本地线路中断告警配置。部署到 /opt/vyomni-agent/line_alert.conf",
  "enabled": true,
  "check_interval": 15,
  "default_fail_threshold": 3,
  "_webhooks_comment": "本地直发告警通道。type: dingtalk/wecom/feishu/lark/telegram/generic。可配多个全部发送",
  "webhooks": [
    {
      "type": "dingtalk",
      "url": "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN"
    },
    {
      "_note": "飞书/Lark 自定义机器人",
      "type": "feishu",
      "url": "https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_HOOK_ID"
    },
    {
      "_note": "Telegram: url 为 sendMessage 端点, 需填 chat_id",
      "type": "telegram",
      "url": "https://api.telegram.org/botYOUR_BOT_TOKEN/sendMessage",
      "chat_id": "YOUR_CHAT_ID"
    }
  ],
  "_server_report_comment": "可选：回传告警事件到 Server 供看板展示。enabled=false 则纯本地直发",
  "server_report": {
    "enabled": false,
    "url": "http://SERVER_IP:9100/api/line-alert"
  },
  "_exports_comment": "物理出口监控。bind_mode: interface(绑接口名) | src_ip(绑源IP,需填bind_src_ip) | none(不绑)",
  "exports": [
    {
      "name": "电信CN2主线",
      "interface": "eth1",
      "enabled": true,
      "ping_target": "202.96.128.86",
      "bind_mode": "interface",
      "bind_src_ip": "",
      "fail_threshold": 3
    },
    {
      "name": "联通备线",
      "interface": "eth2",
      "enabled": true,
      "ping_target": "8.8.8.8",
      "bind_mode": "src_ip",
      "bind_src_ip": "192.168.2.1",
      "fail_threshold": 3
    }
  ],
  "_tunnels_comment": "wg 隧道监控。enabled=false 则完全不执行隧道告警(仅监控物理出口)。watch_list 空=监控全部peer；aliases 为 peer公钥到可读名映射",
  "tunnels": {
    "enabled": true,
    "handshake_timeout": 180,
    "fail_threshold": 2,
    "watch_list": [],
    "aliases": {
      "PEER_PUBKEY_BASE64=": "上海分支"
    }
  }
}
